name: Spell Check

on:
  push:
    branches:
      - main
  pull_request:

env:
  CLICOLOR: 1

jobs:
  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
    - name: Strip notebook outputs
      run: python .github/scripts/strip_notebook_outputs.py
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.44.0
      with:
        config: .github/typos.toml

  pr-suggestions:
    name: PR Typo Suggestions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout base branch
      uses: actions/checkout@v5
      with:
        ref: ${{ github.base_ref }}
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
    - name: Strip notebook outputs (base)
      run: |
        python .github/scripts/strip_notebook_outputs.py
        git add -A
    - name: Fix typos on base
      continue-on-error: true
      uses: crate-ci/typos@v1.44.0
      with:
        write_changes: true
        config: .github/typos.toml
    - name: Stage base fixes as baseline
      run: git add -A
    - name: Restore PR content
      run: git diff --name-only HEAD ${{ github.event.pull_request.head.sha }} \
       | xargs -r git checkout ${{ github.event.pull_request.head.sha }} --
    - name: Strip notebook outputs (PR)
      run: |
        python .github/scripts/strip_notebook_outputs.py
        git add -A
    - name: Fix typos on PR
      continue-on-error: true
      uses: crate-ci/typos@v1.44.0
      with:
        write_changes: true
        config: .github/typos.toml
    - name: Comment on PR
      uses: getsentry/action-git-diff-suggestions@main
      with:
        message: "Typos found in the above files"
