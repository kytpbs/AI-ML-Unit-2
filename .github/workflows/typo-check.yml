name: Spell Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CLICOLOR: 1

jobs:
  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v5
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
    - name: Strip notebook outputs
      run: |
        python .github/scripts/strip_notebook_outputs.py
        git add -A
        git -c user.name="ci" -c user.email="ci@ci" commit -m "strip outputs" --allow-empty
    - name: Spell Check Repo
      id: spell-check
      continue-on-error: true
      uses: crate-ci/typos@v1.44.0
      with:
        write_changes: true
        config: .github/typos.toml
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: getsentry/action-git-diff-suggestions@main
      with:
        message: "Typos found in the above files"
    - name: Fail on typo
      if: steps.spell-check.outcome == 'failure'
      run: exit 1
